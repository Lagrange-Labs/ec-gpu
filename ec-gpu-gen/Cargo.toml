[package]
name = "ec-gpu-gen"
version = "0.7.1"
authors = ["dignifiedquire <me@dignifiedquire.com>"]
edition = "2021"
description = "Code generator for field and elliptic curve operations on the GPUs"
homepage = "https://github.com/filecoin-project/ff-cl-gen"
repository = "https://github.com/filecoin-project/ff-cl-gen"
license = "MIT/Apache-2.0"
rust-version = "1.83.0"

[dependencies]
bitvec = "1.0.1"
crossbeam-channel = "0.5.1"
ec-gpu.workspace = true
execute = "0.2.9"
hex = "0.4"
# Pin home to version compatible with Rust 1.83 (edition 2021)
home = "=0.5.9"
log = "0.4.14"
num_cpus = "1.13.0"
once_cell = "1.8.0"
rayon = "1.5.1"
rust-gpu-tools = { version = "0.7.0", default-features = false, optional = true }
sha2 = "0.10"
thiserror = "1.0.30"
tracing = "0.1"
yastl = "0.1.2"

ark-bn254 = { version = "0.5.0", optional = true }
ark-std = { version = "0.5.0", optional = true }
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = { version = "0.5.0", optional = true }

[dev-dependencies]
rand = "0.8"
lazy_static = "1.2"
temp-env = "0.3.0"
ark-bn254 = "0.5.0"

[features]
default = []
cuda = ["rust-gpu-tools/cuda"]
opencl = ["rust-gpu-tools/opencl"]
arkworks = ["ec-gpu/arkworks", "dep:ark-bn254", "dep:ark-std", "dep:ark-serialize"]
