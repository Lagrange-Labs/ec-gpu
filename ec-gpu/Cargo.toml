[package]
name = "ec-gpu"
version = "0.2.0"
authors = ["dignifiedquire <me@dignifiedquire.com>"]
edition = "2021"
description = "Traits for field and elliptic curve operations on GPUs"
homepage = "https://github.com/filecoin-project/ff-cl-gen"
repository = "https://github.com/filecoin-project/ff-cl-gen"
license = "MIT/Apache-2.0"

[dependencies]
ark-bn254 = { version = "0.5.0", optional = true, default-features = false, features = ["curve"] }
ark-ec = { version = "0.5.0", optional = true }
ark-ff = { version = "0.5.0", optional = true }
ark-serialize = { version = "0.5.0", optional = true }
ark-std = { version = "0.5.0", optional = true }

[features]
arkworks = [
	"dep:ark-bn254",
	"dep:ark-ec",
	"dep:ark-ff",
	"dep:ark-serialize",
	"dep:ark-std",
]
